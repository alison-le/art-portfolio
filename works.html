  <script>
    const grid = document.querySelector('.works-grid');
    let metadata = {};

    // Load metadata from CSV and populate sidebar
    fetch('works.csv')
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split('\n');
        const headers = lines[0].split(',');
        for (let i = 1; i < lines.length; i++) {
          const vals = lines[i].split(',');
          const entry = {};
          headers.forEach((h, idx) => { entry[h.trim()] = vals[idx] ? vals[idx].trim() : ''; });
          metadata[entry.id] = entry;
        }

        // Populate sidebar link text and image alt text from CSV title
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
          const id = link.getAttribute('href').slice(1);
          const data = metadata[id];
          if (data && data.title) {
            link.textContent = data.title;
            const entry = document.getElementById(id);
            if (entry) {
              const img = entry.querySelector('img');
              if (img) {
                img.alt = data.title;
                img.title = data.title;
              }
            }
          }
        });
      });

    document.querySelectorAll('.sidebar-nav a').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').slice(1);
        const targetEntry = document.getElementById(targetId);

        // Remove active and caption from all entries
        document.querySelectorAll('.work-entry').forEach(entry => {
          entry.classList.remove('active');
          const cap = entry.querySelector('.work-caption');
          if (cap) cap.remove();
        });

        // Show and enlarge the selected one
        targetEntry.classList.add('active');

        // Build caption from CSV metadata
        const data = metadata[targetId] || {};
        const title = data.title || 'Untitled';
        const date = data.date || '2025';
        const material = data.material || 'MATERIAL';
        const dimensions = data.dimensions || 'DIMENSIONS';
        const caption = document.createElement('p');
        caption.className = 'work-caption';
        caption.innerHTML = `Alison Le. <em>${title}</em>, ${date}. ${material}. ${dimensions}.`;
        targetEntry.appendChild(caption);

        grid.classList.add('viewing');
      });
    });

    // Close enlarged view when clicking the image or the grid background
    grid.addEventListener('click', function(e) {
      if (e.target === this || e.target.tagName === 'IMG') {
        document.querySelectorAll('.work-entry').forEach(entry => {
          entry.classList.remove('active');
          const cap = entry.querySelector('.work-caption');
          if (cap) cap.remove();
        });
        grid.classList.remove('viewing');
      }
    });
  </script>
